services:
  db:
    image: postgres:16-alpine
    container_name: salon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salon}
      POSTGRES_DB: ${POSTGRES_DB:-salon}
      # Служебная БД под pytest создаётся init-скриптом ниже
      TEST_DB: ${POSTGRES_DB:-salon}_test
    ports:
      # Наружу 5433, чтобы не конфликтовать с локально установленным PostgreSQL
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salon} -d ${POSTGRES_DB:-salon}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
