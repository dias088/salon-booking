# NOTE: keep this file ASCII-only.
# Alembic reads it with encoding="locale", which on a Russian Windows is
# cp1251 and chokes on UTF-8 bytes. Comments here are in English on purpose.

[alembic]
script_location = alembic
prepend_sys_path = .
# Filenames look like 0001_initial_schema.py, so they sort in apply order.
file_template = %%(rev)s_%%(slug)s
timezone = UTC
# The URL is injected by alembic/env.py from app.core.config,
# so no password ever lands in the repository.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
