[alembic]
script_location = alembic
prepend_sys_path = .
# Имена файлов вида 0001_initial_schema.py — читаются по порядку
file_template = %%(rev)s_%%(slug)s
timezone = UTC
# URL не хранится здесь: его подставляет alembic/env.py из app.core.config
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
